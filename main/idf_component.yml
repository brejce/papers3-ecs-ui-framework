## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'

  ## ★★ m5gfx / m5unified / elf_loader / cmake_utilities 四个组件都**必须 vendor**
  ##    到项目 components/ 下，不能在这里声明 —— 一旦声明，组件管理器就会把上游版本
  ##    下到 managed_components/，遮蔽（或直接覆盖）本地改动。
  ##
  ##    这几个是**第三方库**（约 165MB / 1000+ 文件），**不进 git**：
  ##      ./tools/fetch_components.sh     ← 按根目录 components.lock 拉上游 zip（版本钉死、
  ##                                        逐文件核官方 CHECKSUMS.json）+ 打 patches/ 里的本地补丁
  ##      ./tools/fetch_components.sh --verify   ← 只校验现有 components/ 是不是 lock 那一版
  ##    ★ 版本号的唯一权威是 components.lock，改版本只改那里。
  ##
  ##    本地改动一共 5 个文件，逐条说明见 patches/README.md：
  ##      1) m5gfx/Panel_EPD.{cpp,hpp}  ← EPD 波形换表钩子（reload_lut_table /
  ##         lut_alloc_steps）+ 4bpp 精确区域存取 + 仿射快路径 + isDrawing()
  ##      2) m5unified/Touch_Class.*    ← 只读原始触点（readRawOnly，不消费
  ##         wasPressed 状态）+ I2C 互斥
  ##      3) elf_loader/esp_elf.c       ← 符号表地址补 elf_remap_text
  ##      4) cmake_utilities            ← 未改动，纯为解掉 elf_loader 对它的依赖链
  ##
  ## ⚠️ 血泪教训（2026-10-15 实测）：删 dependencies.lock 会让这里的依赖被重新解析 ——
  ##    当时 elf_loader 写的是 '*'，组件被整份重下，**把打的补丁冲掉了**。
  ##    症状：launcher 里打开 .so 立刻退回主页（其实是崩了重启），
  ##    串口是 Guru Meditation: InstructionFetchError，PC/EXCVADDR 都在 0x3c28xxxx (PSRAM)。
  ##    —— 这**不是**版本问题：钉回 1.3.3 照样崩，因为补丁本身没了（我一开始判断错了）。
  ##    结论：本地改过的组件一律 vendor 到 components/，不要留在 managed_components/。
  ##
  ##    （dependencies.lock 记的是绝对路径，换机器就是死路径，所以已进 .gitignore；
  ##      fetch_components.sh 跑完会顺手删掉它，下次 build 按当前路径重新生成。）
